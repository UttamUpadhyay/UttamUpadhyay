name: Daily Quote Update

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update README with daily quote
        run: |
          QUOTES=(
            "Every line of code is a step towards mastery."
            "Code is poetry written in logic."
            "The best time to write clean code is now."
            "Debugging is twice as hard as writing code."
            "First, solve the problem. Then, write the code."
            "Quality is not an act, it is a habit."
            "Simplicity is the soul of efficiency."
            "Good code is its own best documentation."
            "Innovation distinguishes between a leader and a follower."
            "The only way to do great work is to love what you do."
            "Programming is the art of telling another human what you want the computer to do."
            "Coding is today's language of expression."
          )
          # Use /dev/urandom for better randomness
          RANDOM_INDEX=$(($(od -An -N2 -tu2 /dev/urandom | tr -d ' ') % ${#QUOTES[@]}))
          RANDOM_QUOTE="${QUOTES[$RANDOM_INDEX]}"
          
          # Escape quotes properly for sed
          ESCAPED_QUOTE=$(printf '%s\n' "$RANDOM_QUOTE" | sed -e 's/[\/&]/\\&/g')
          sed -i "s|### ✨.*✨|### ✨ \"$ESCAPED_QUOTE\" ✨|" README.md
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily quote"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
